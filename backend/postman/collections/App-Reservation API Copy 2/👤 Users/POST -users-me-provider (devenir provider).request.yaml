$kind: http-request
name: POST /users/me/provider (devenir provider)
url: "{{baseUrl}}/users/me/provider"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "bio": "Coach sportif certifié avec 10 ans d'expérience.",
      "category": "COACHING",
      "locationAddress": "12 Rue de la Paix, Paris",
      "locationLat": 48.8698,
      "locationLng": 2.3317
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.provider?.id) pm.collectionVariables.set('providerId', res.id);
      pm.test('Status 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 3000
