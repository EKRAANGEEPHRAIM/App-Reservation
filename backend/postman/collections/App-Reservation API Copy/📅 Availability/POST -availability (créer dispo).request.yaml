$kind: http-request
name: POST /availability (créer dispo)
url: "{{baseUrl}}/availability"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dayOfWeek": "MONDAY",
      "startTime": "09:00",
      "endTime": "17:00"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.id) pm.collectionVariables.set('availabilityId', res.id);
      pm.test('Status 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
