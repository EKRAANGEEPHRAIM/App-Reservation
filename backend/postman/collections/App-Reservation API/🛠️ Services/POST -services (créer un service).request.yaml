$kind: http-request
name: POST /services (créer un service)
url: "{{baseUrl}}/services"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Séance coaching individuelle",
      "description": "1h de coaching personnalisé en salle.",
      "durationMin": 60,
      "price": 75.00,
      "currency": "EUR"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.id) pm.collectionVariables.set('serviceId', res.id);
      pm.test('Status 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
