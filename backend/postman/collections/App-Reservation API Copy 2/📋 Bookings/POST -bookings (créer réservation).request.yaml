$kind: http-request
name: POST /bookings (créer réservation)
url: "{{baseUrl}}/bookings"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "providerId": "{{providerId}}",
      "serviceId": "{{serviceId}}",
      "startAt": "2025-07-07T10:00:00.000Z",
      "notes": "Je souhaite travailler sur la posture."
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.id) pm.collectionVariables.set('bookingId', res.id);
      pm.test('Status 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
